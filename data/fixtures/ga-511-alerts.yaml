- messages:
    messageLang1:
      message: 'SEVERE WEATHER ALERT: Hurricane Isaias Impacts (10/9 - 10/11)'
      additionalText: '<p>Be advised that heavy inclement weather from Hurricane Isaias
        is expected to affect portions of North and Central Georgia on Friday, October
        9, and will last through Sunday, October 11. Motorists are advised to avoid
        unnecessary travel when conditions are severe.</p>


        <p>Call 511 and check 511ga.org for real-time travel and weather information.
        <a href="https://gcc02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.weather.gov%2Fffc%2F&amp;data=05%7C02%7CILichtenstein%40dot.ga.gov%7C3f0ad0860c6b4050d60108df260d67de%7C04114ecf94554af6a33d6ee55e3d3455%7C0%7C0%7C639271511207225008%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=VSzDtaGII6YnY1EXfjJwD8zdLYJK4NIMRCsWMqwhQI4%3D&amp;reserved=0"
        rel="noopener noreferrer" target="_blank" title="Original URL: https://www.weather.gov/ffc/.
        Click or tap if you trust this link.">View more from NWS Atlanta here</a></p>


        <p>&nbsp;</p>

        '
    messageLang2:
      message: 'SEVERE WEATHER ALERT: Hurricane Isaias Impacts (10/9 - 10/11)'
