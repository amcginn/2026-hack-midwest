- messages:
    messageLang1:
      message: I-285 Westside Rebuild Closures (10/9 - 10/12)
      additionalText: 'Weather permitting, all northbound and southbound lanes will
        be closed on I-285 between S. Atlanta Rd. (exit 16) and S. Cobb Dr. (exit
        15) beginning Friday, October 9 at 7:00 pm through Monday, October 12 at 5:00
        am. Use alternate routes, call 511 for updates, and check back here for any
        additional closure information.<br>

        <br>

        <a href="http://https://511ga.org/EventDetails/Incidents/GA-Events/5655342">View
        the press release here</a>'
