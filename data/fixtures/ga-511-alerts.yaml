      additionalText: '<p>Be advised that heavy inclement weather from Hurricane Isaias
        is expected to affect portions of North and Central Georgia on Friday, October
        9, and will last through Sunday, October 11. Motorists are advised to avoid
        unnecessary travel when conditions are severe.</p>


        <p>Call 511 and check 511ga.org for real-time travel and weather information.
