    messageLang1:
      message: 'Major Crash: Douglas County: WB I-20 at SR 6/Thornton Rd'
      additionalText: 'This is a 511 Georgia travel alert. 3 left lanes are blocked
        westbound I-20 at SR 6/Thornton Rd (exit 44)&nbsp;due a crash in Douglas County.&nbsp;
        Emergency responders are currently working to reopen the lanes as quickly
        and as safely as possible.<br>

        <br>

        Motorists are strongly encouraged to avoid this area and seek an alternate
        route in order to avoid extreme delays. For more information, please call
        511 or continue to check <a href="http://www.511ga.org">www.511ga.org</a><br>

