- messages:
    messageLang1:
      message: 'Weekend Lane Closures: 10/9-10/12'
      additionalText: '<p>Weather permitting, motorists should expect the following
        weekend closure beginning Friday, October 9, at 7:00 pm through Monday, October
        12, at 5:00 am:&nbsp;&nbsp;&nbsp;</p>


        <p lang="EN-US"><ins><strong>I-95 N/S between MM 99-87 </strong></ins>&nbsp;<br>

        Double left/right lane closure&nbsp;</p>


        <p>Follow detours as delays are expected. Plan ahead and drive with caution
        in work zones. For real-time traffic updates, call 511, visit <a href="http://www.511ga.org/"
        rel="noreferrer noopener" target="_blank">511GA.org</a>, or use the 511GA
        app. For more weekend closure locations, please view the link <a href="https://www.dot.ga.gov/GDOT/Pages/WeekendLaneClosures.aspx"
        rel="noreferrer noopener" target="_blank">here</a>.&nbsp;</p>

