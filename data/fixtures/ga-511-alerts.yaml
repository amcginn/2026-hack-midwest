- messages:
    messageLang1:
      message: BARTOW COUNTY-All Lanes Blocked-SR 113 NB at Erwin st
      additionalText: 'This is a 511 Georgia travel alert. All Lanes are blocked northbound
        SR 113 at Erwin st (mile marker 0) due to police activity in Bartow county.
        Emergency responders are currently working to reopen the lanes as quickly
        as possible. Motorists are strongly encouraged to avoid this area and seek
        an alternate route to avoid extreme delays. For more information, please call
        511 or continue to check www.511GA.ORG<br>

        &nbsp;'
