datums:
  vertical:
    value:
    - label: National Geodetic Vertical Datum of 1929
      abbrev: NGVD29
      description: A fixed reference adopted as a standard geodetic datum for elevations
        determined by leveling. The datum was derived for surveys from a general adjustment
        of the first-order leveling nets of both the United States and Canada. In
        the adjustment, mean sea level was held fixed as observed at 21 tide stations
        in the United States and 5 in Canada. The year indicates the time of the general
        adjustment. A synonym for Sea-level Datum of 1929. The geodetic datum is fixed
        and does not take into account the changing stands of sea level. Because there
        are many variables affecting sea level, and because the geodetic datum represents
        a best fit over a broad area, the relationship between the geodetic datum
        and local mean sea level is not consistent from one location to another in
        either time or space. For this reason, the National Geodetic Vertical Datum
        should not be confused with mean sea level. See North American Vertical Datum
        of 1988 (NAVD 88). NGVD 29 should not be used as Mean Sea Level. NGVD 29 is
        no longer supported by NGS.
      value: 562.68
