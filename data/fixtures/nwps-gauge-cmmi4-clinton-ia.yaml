  impacts:
  - stage: 30
    statement: Water reaches the top of the flood wall which protects almost all of
      Clinton. Water also reaches the top of the Fulton flood wall.
  - stage: 28
    statement: Water overtops the Meredosia levee.
  - stage: 24
    statement: Water affects the grain elevator on Illinois Highway 84 at Albany.
  - stage: 23
    statement: Water affects U.S. Highway 67 at the mouth of the Wapsipinicon River
      at Folletts.
  - stage: 22.8
    statement: Water reaches the bottom of the railroad bridge.
  - stage: 22
    statement: Water affects houses and commercial businesses on the Clinton riverfront
      between 27th Avenue and 36th Avenue North. In Fulton, water affects houses north
      of the levee north of 3rd Avenue.
  - stage: 21.4
    statement: Water affects Illinois Highway 84 near Albany.
  - stage: 21
    statement: Water affects many homes in Camanche and is at the base of the Camanche
      water treatment plant.
  - stage: 20
    statement: Water affects South Washington Boulevard in Camanche. Water also affects
      the Camanche Marina. Water also affects several homes in Albany.
  - stage: 19.5
    statement: Water affects marina facilities at River View Park in Clinton.
  - stage: 19
    statement: Water affects homes in the Camanche Swan Slough area, the boat ramp,
      and 9th Street by Hazel Lake. Water affects Union Pacific Railroad maintenance
      buildings in Clinton.
  - stage: 17
    statement: Water affects low-lying residences at Albany.
  - stage: 16.5
    statement: Water affects the city owned baseball stadium in Clinton.
