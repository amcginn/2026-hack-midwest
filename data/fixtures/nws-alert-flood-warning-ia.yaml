    headline: Flood Warning issued October 10 at 10:19AM CDT until October 13 at 1:48AM
      CDT by NWS Quad Cities IA IL
    description: '...The Flood Warning continues for the following rivers in Iowa...


      Wapsipinicon River near De Witt 4S affecting Clinton and Scott

      Counties.


      * WHAT...Major flooding is occurring.


      * WHERE...Wapsipinicon River near De Witt 4S.


      * WHEN...Until late Monday night.


      * IMPACTS...At 12.5 feet, Water affects old U.S. Highway 61 near the

      river.


      * ADDITIONAL DETAILS...

      - At 9:30 AM CDT Saturday the stage was 12.5 feet.

      - Forecast...The river is expected to crest today and fall below

      flood stage Monday afternoon and continue falling to 8.2 feet

      Saturday, October 17.

      - Flood stage is 11.0 feet.'
    instruction: 'Turn around, don''t drown when encountering flooded roads. Most
      flood

      deaths occur in vehicles.


      Motorists should not attempt to drive around barricades or drive cars

      through flooded areas.


      Caution is urged when walking near riverbanks.


      The next statement will be issued by Sunday morning.'
